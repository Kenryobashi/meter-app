<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>メーター記録</title>
<meta name="description" content="車両のメーター値を毎日記録するアプリ">
<meta name="theme-color" content="#242832">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="メーター">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #1b1e25;
  --panel: #242832;
  --panel-raised: #2c313d;
  --bezel: #14161b;
  --hairline: #383d48;
  --text: #eceae3;
  --text-dim: #8b91a0;
  --amber: #ffb454;
  --amber-dim: rgba(255,180,84,0.18);
  --amber-glow: rgba(255,180,84,0.45);
  --mint: #6fd3a0;
  --danger: #e07a6a;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.num {
  font-family: "SF Mono", "Roboto Mono", "JetBrains Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}
button { font-family: inherit; border: none; cursor: pointer; }

.wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px 72px; }

/* ── App header ── */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.app-title { font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; cursor: pointer; user-select: none; }
.vehicle-input {
  width: 100%; background: var(--bezel); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--text); font-family: inherit; font-size: 16px;
  padding: 11px 14px; outline: none; margin-top: 4px;
}
.vehicle-input::placeholder { color: var(--text-dim); opacity: 0.5; }
.notif-btn {
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 50%;
  width: 36px; height: 36px;
  font-size: 17px;
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
}
.notif-btn.granted { color: var(--amber); border-color: rgba(255,180,84,0.4); }

/* ── Banners ── */
.banner {
  border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  font-size: 13px; line-height: 1.55; display: none;
}
.banner.show { display: block; }
.banner-notif  { background: var(--amber-dim); border: 1px solid rgba(255,180,84,0.35); }
.banner-reminder { background: rgba(111,211,160,0.1); border: 1px solid rgba(111,211,160,0.3); }
.banner strong { color: var(--amber); }
.banner-reminder strong { color: var(--mint); }
.banner-actions { margin-top: 8px; display: flex; gap: 8px; }
.banner-actions button { padding: 6px 14px; border-radius: 8px; font-size: 12px; }
.btn-allow { background: var(--amber); color: #2a1d0c; font-weight: 700; }
.btn-dismiss { background: transparent; color: var(--text-dim); border: 1px solid var(--hairline); }

/* ── Setup card ── */
.setup-card {
  background: var(--panel); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
}
.setup-card h2 { font-size: 14px; margin: 0 0 12px; }
.setup-note { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-top: 10px; }

/* ── Week nav ── */
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px;
}
.week-nav-btn {
  background: var(--panel-raised); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--text); font-size: 14px;
  width: 36px; height: 32px; display: flex; align-items: center; justify-content: center;
}
.week-nav-btn:disabled { opacity: 0.3; cursor: default; }
.week-label { font-size: 13px; font-weight: 600; color: var(--text); text-align: center; flex: 1; padding: 0 8px; }
.today-btn {
  background: var(--amber); color: #2a1d0c; border: none;
  border-radius: 8px; font-size: 11px; font-weight: 700; padding: 6px 10px;
}

/* ── Day cards ── */
.day-card {
  background: var(--panel); border: 1px solid var(--hairline);
  border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
}
.day-card.today-card { border-color: rgba(255,180,84,0.4); }

.day-header {
  display: grid;
  grid-template-columns: 112px 80px 52px 1fr 20px 16px;
  align-items: center;
  column-gap: 6px;
  padding: 11px 14px; cursor: pointer; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.day-label { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.day-label.is-today  { color: var(--amber); }
.day-label.is-future { color: var(--text-dim); }
.day-dist {
  font-size: 13px; color: var(--mint); font-weight: 600;
  font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  text-align: left;
}
.day-time {
  font-size: 11px; color: var(--text-dim); font-weight: 500;
  font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  text-align: left;
}
.day-tags-preview {
  font-size: 11px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.day-check { color: var(--mint); font-size: 14px; text-align: center; }
.pending-check { color: #f0a020; }
.pending-dist { color: #f0a020; font-size: 11px; font-weight: 600; }
.btn-pending { background: #f0a020 !important; }
.save-hint { margin-top: 6px; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.day-chevron { color: var(--text-dim); font-size: 11px; transition: transform 0.2s; text-align: right; }
.day-card.open .day-chevron { transform: rotate(180deg); }

.day-body { display: none; padding: 2px 14px 14px; border-top: 1px solid var(--hairline); }
.day-card.open .day-body { display: block; }

/* ── Fields ── */
.fld-label { font-size: 11px; color: var(--text-dim); margin: 12px 0 5px; letter-spacing: 0.06em; }

.meter-prev {
  background: var(--bezel); border-radius: 8px; padding: 9px 12px;
  font-size: 13px; color: var(--text-dim);
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
}
.meter-input-wrap {
  background: var(--bezel); border-radius: 8px; padding: 9px 12px;
  display: flex; align-items: center;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
}
.meter-input-wrap input {
  background: transparent; border: none; outline: none;
  color: var(--amber); text-shadow: 0 0 10px var(--amber-glow);
  font-size: 24px; text-align: right; width: 100%;
  -webkit-appearance: none; appearance: textfield;
  font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.meter-input-wrap input::placeholder { color: #5a5142; opacity: 0.8; }
.meter-unit { font-size: 12px; color: var(--text-dim); margin-left: 6px; align-self: flex-end; padding-bottom: 2px; }

/* 乗車／降車時刻の2列 */
.time-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.time-pair input {
  width: 100%; background: var(--bezel); border: none; outline: none;
  border-radius: 8px; padding: 9px 12px; color: var(--amber);
  font-size: 17px; text-align: center;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
  font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
}
.time-pair input:disabled { color: var(--text-dim); }

/* タグ連動の金額入力欄 */
.cost-wrap { display: none; margin-top: 10px; }
.cost-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel-raised); border-radius: 8px;
  padding: 7px 12px; margin-bottom: 6px;
}
.cost-label { font-size: 12px; color: var(--text-dim); flex: 1; }
.cost-input {
  background: var(--bezel); border: none; outline: none; border-radius: 6px;
  color: var(--amber); font-size: 16px; text-align: right;
  padding: 6px 10px; width: 110px;
  -webkit-appearance: none; appearance: textfield;
  font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.cost-input::placeholder { color: #5a5142; opacity: 0.7; }
.cost-unit { font-size: 11px; color: var(--text-dim); width: 20px; }
.dest-row .cost-input { width: 150px; text-align: left; font-size: 14px; color: var(--text); }

.trip-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--panel-raised);
  border-radius: 8px; margin-top: 8px; font-size: 13px;
}
.t-label { color: var(--text-dim); }
.t-val { color: var(--mint); font-weight: 600; }
.t-val.zero { color: var(--text-dim); }
.t-val.warn { color: var(--danger); font-size: 12px; }

/* ── Tags ── */
.tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag-pill {
  padding: 5px 13px; border-radius: 20px; font-size: 12.5px;
  border: 1px solid var(--hairline); background: var(--bezel); color: var(--text-dim);
  cursor: pointer; user-select: none;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.tag-pill.active {
  background: var(--amber-dim); color: var(--amber);
  border-color: rgba(255,180,84,0.6); font-weight: 600;
}

/* ── Memo ── */
textarea.memo-input {
  width: 100%; background: var(--bezel); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--text); font-family: inherit;
  font-size: 13px; padding: 9px 12px; resize: none; margin-top: 6px;
  min-height: 54px; line-height: 1.5;
}
textarea.memo-input::placeholder { color: var(--text-dim); opacity: 0.55; }
textarea.memo-input:focus { outline: 1px solid var(--hairline); border-color: var(--hairline); }

/* ── Buttons ── */
.btn-primary {
  width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px;
  background: var(--amber); color: #2a1d0c; font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
}
.btn-primary:disabled { opacity: 0.35; cursor: default; }
.btn-secondary {
  width: 100%; margin-top: 8px; padding: 10px; border-radius: 9px;
  background: var(--panel-raised); color: var(--text); font-size: 13px; border: 1px solid var(--hairline);
}
.btn-secondary:active { background: var(--bezel); }
@media (prefers-reduced-motion: no-preference) { .save-pulse { animation: pulse 0.4s ease; } }
@keyframes pulse { 0%{transform:scale(1)} 40%{transform:scale(1.015)} 100%{transform:scale(1)} }

/* ── Odo display (setup) ── */
.odo-display {
  background: var(--bezel); border-radius: 8px; padding: 10px 14px;
  display: flex; align-items: center; justify-content: flex-end;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
}
.odo-display input {
  background: transparent; border: none; outline: none;
  color: var(--amber); text-shadow: 0 0 10px var(--amber-glow);
  font-size: 28px; text-align: right; width: 100%;
  -webkit-appearance: none; appearance: textfield;
  font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
}
.odo-display input::placeholder { color: #5a5142; opacity: 0.7; }

/* ── ETC card ── */
.etc-card {
  margin-top: 10px;
  border-radius: var(--radius);
  overflow: hidden;
}
.btn-etc {
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  width: 100%; padding: 14px;
  background: #1a3a2a;
  border: 1px solid rgba(111,211,160,0.35);
  border-radius: var(--radius);
  color: var(--mint);
  font-size: 15px; font-weight: 700;
  text-decoration: none;
  letter-spacing: 0.02em;
  -webkit-tap-highlight-color: transparent;
}
.btn-etc:active { background: #122a1f; }
.etc-note {
  font-size: 11.5px; color: var(--text-dim);
  text-align: center; margin-top: 7px; line-height: 1.5;
}
.etc-sent {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 9px; font-size: 12.5px; color: var(--text-dim);
  padding: 9px; background: var(--panel); border-radius: 8px;
  border: 1px solid var(--hairline); cursor: pointer;
}
.etc-sent input { width: 17px; height: 17px; accent-color: #6fd3a0; }

/* プロフィール設定 */
.pf-label { display:block; font-size: 12px; color: var(--text-dim); margin: 12px 0 5px; }
.pf-time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pf-check {
  display: flex; align-items: flex-start; gap: 9px; margin-top: 14px;
  font-size: 12.5px; color: var(--text); line-height: 1.55; cursor: pointer;
}
.pf-check input { width: 18px; height: 18px; margin-top: 1px; accent-color: #ffb454; flex-shrink: 0; }
.pf-check small { color: var(--text-dim); font-size: 11px; }

/* 週次レポート */
.report-card { margin-top: 10px; }
.btn-report {
  width: 100%; padding: 15px;
  background: linear-gradient(180deg,#2f3a52,#243046);
  border: 1px solid rgba(140,170,230,0.35);
  border-radius: var(--radius);
  color: #cfe0ff; font-size: 15px; font-weight: 700;
  -webkit-tap-highlight-color: transparent; cursor: pointer;
}
.btn-report:active { background: #1c2536; }
.report-note {
  font-size: 11.5px; color: var(--text-dim);
  text-align: center; margin-top: 7px; line-height: 1.5;
}


/* ── Toast ── */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--mint); color: #10271b; font-size: 13px; padding: 9px 18px;
  border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  white-space: nowrap; z-index: 200;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <div class="app-title" id="appTitle">車両メーター記録</div>
    <button class="notif-btn" id="settingsBtn" title="基本情報の設定">⚙</button>
    <button class="notif-btn" id="notifBtn" title="通知設定">🔔</button>
  </header>

  <!-- プロフィール設定（初回＋設定ボタンから再編集） -->
  <div class="setup-card" id="vehicleCard" style="display:none;">
    <h2>🚗 基本情報の設定</h2>
    <div class="setup-note" style="margin-bottom:12px;">週次レポートの見出しに使います。一度登録すれば以後は入力不要です。</div>

    <label class="pf-label">氏名</label>
    <input type="text" id="pfName" class="vehicle-input" placeholder="例：[2004002]石橋 誠仁">

    <label class="pf-label">部課名</label>
    <input type="text" id="pfDept" class="vehicle-input" placeholder="例：[2636] 機械3部 北九州">

    <label class="pf-label">車両No</label>
    <input type="text" id="vehicleInput" class="vehicle-input" placeholder="例：301に_5421">

    <label class="pf-label">いつもの運行先</label>
    <input type="text" id="pfDest" class="vehicle-input" placeholder="例：×××社他">

    <label class="pf-label">レポート送付先メールアドレス</label>
    <input type="email" id="pfEmail" class="vehicle-input" placeholder="例：you@example.co.jp">

    <div class="pf-time-row">
      <div>
        <label class="pf-label">乗車時刻（既定）</label>
        <input type="time" id="pfStart" class="vehicle-input">
      </div>
      <div>
        <label class="pf-label">降車時刻（既定）</label>
        <input type="time" id="pfEnd" class="vehicle-input">
      </div>
    </div>

    <label class="pf-check">
      <input type="checkbox" id="pfAuto">
      <span>降車時刻を保存した時刻で自動記録する<br>
        <small>残業などで終業時刻が日々変わる方はONにしてください</small></span>
    </label>

    <button class="btn-primary" id="vehicleSaveBtn" style="margin-top:14px;">保存して始める</button>
  </div>

  <!-- 通知許可バナー -->
  <div class="banner banner-notif" id="notifBanner">
    <strong>📲 プッシュ通知を有効にしませんか？</strong><br>
    日曜夜にリマインド、月曜朝8時に週報を自動でお知らせします。
    <div class="banner-actions">
      <button class="btn-allow" id="notifAllowBtn">通知を許可する</button>
      <button class="btn-dismiss" id="notifDismissBtn">後で</button>
    </div>
  </div>

  <!-- リマインダーバナー -->
  <div class="banner banner-reminder" id="reminderBanner"></div>

  <!-- 初回設定 -->
  <div class="setup-card" id="setupCard" style="display:none;">
    <h2>📍 初回設定：現在のメーター値</h2>
    <div class="odo-display">
      <input type="number" inputmode="numeric" id="setupInput" placeholder="例: 65891" class="num">
      <span class="meter-unit">km</span>
    </div>
    <button class="btn-primary" id="setupSaveBtn" style="margin-top:12px;">これで開始する</button>
    <div class="setup-note">今日の終わりのメーター値を入力してください。翌日以降は前日の値を自動で引き継ぎます。</div>
  </div>

  <!-- 週ナビゲーション -->
  <div class="week-nav" id="weekNav" style="display:none;">
    <button class="week-nav-btn" id="prevWeekBtn">←</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="today-btn" id="todayWeekBtn">今週</button>
    <button class="week-nav-btn" id="nextWeekBtn">→</button>
  </div>

  <!-- 日ごとのカード -->
  <div id="dayCards"></div>

  <!-- ETC照会ボタン -->
  <div class="etc-card" id="etcCard" style="display:none;">
    <a id="etcLink" href="https://www2.etc-meisai.jp/etc/R?funccode=1013000000&nextfunc=1013000000"
       target="_blank" rel="noopener" class="btn-etc">
      🛣 ETC利用照会サイトを開く
    </a>
    <div class="etc-note" id="etcNote"></div>
    <label class="etc-sent">
      <input type="checkbox" id="etcSentCheck">
      <span>ETC明細を会社メールへ送付済み</span>
    </label>
  </div>

  <!-- 週次レポート -->
  <div class="report-card" id="reportCard" style="display:none;">
    <button class="btn-report" id="reportBtn">📄 今週のレポートを作る</button>
    <label class="etc-sent">
      <input type="checkbox" id="reportSentCheck">
      <span>この週は提出済み（日曜の通知を止める）</span>
    </label>
    <div class="report-note" id="reportNote"></div>
  </div>


</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'vehicle-meter-log';
const VEHICLE_KEY = 'vehicle-id';
const PROFILE_KEY = 'vehicle-profile';
const NOTIF_DISMISSED_KEY = 'notif-banner-dismissed';
const WEEKDAYS = ['日','月','火','水','木','金','土'];
const TAGS = ['遠方','高速','会食','駐車場','燃料','洗車','その他'];

// タグ → 金額入力欄の定義（会社フォーマットの費目に対応）
const TAG_FIELDS = {
  '燃料':   [{key:'fuelL',  label:'給油量', unit:'L'},
             {key:'fuelYen',label:'燃料代', unit:'円'}],
  '高速':   [{key:'tollYen',label:'通行料', unit:'円'}],
  '駐車場': [{key:'parkYen',label:'一時駐車代', unit:'円'}],
  '洗車':   [{key:'washYen',label:'洗車・ウォッシャー液', unit:'円'}],
  'その他': [{key:'otherYen',label:'その他', unit:'円'}],
};
// レポート集計に使う費目一覧
const COST_KEYS = [
  {key:'fuelYen', label:'燃料代'},
  {key:'tollYen', label:'通行料'},
  {key:'parkYen', label:'一時駐車代'},
  {key:'washYen', label:'洗車ｳｫｯｼｬｰ液'},
  {key:'otherYen',label:'その他'},
];
// 費目キー → 発生を示すタグ（未入力警告の判定用）
const COST_TAG_OF = { fuelYen:'燃料', tollYen:'高速', parkYen:'駐車場', washYen:'洗車', otherYen:'その他' };

// ── プロフィール（初回設定で登録する固定情報） ────────────────
const DEFAULT_PROFILE = {
  name: '', dept: '', vehicleNo: '', defaultDest: '',
  startTime: '07:30', endTime: '18:30', autoEndTime: false, email: ''
};
let profile = { ...DEFAULT_PROFILE };

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (raw) profile = { ...DEFAULT_PROFILE, ...JSON.parse(raw) };
  } catch { profile = { ...DEFAULT_PROFILE }; }
  // 旧バージョンの車両番号を引き継ぐ
  if (!profile.vehicleNo) {
    const old = localStorage.getItem(VEHICLE_KEY);
    if (old) profile.vehicleNo = old;
  }
  return profile;
}
function saveProfile() {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  if (profile.vehicleNo) localStorage.setItem(VEHICLE_KEY, profile.vehicleNo);
}

let state = { entries: {} };
let weekOffset = 0;

// ── Helpers ──────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr() { return dateStr(new Date()); }
function fmtLabel(ds) {
  const d = new Date(ds + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}（${WEEKDAYS[d.getDay()]}）`;
}

function getEntry(ds) {
  const e = state.entries[ds];
  if (!e) return null;
  if (typeof e === 'number') return { meter: e, tags: [], memo: '', time: '' }; // 旧形式互換
  return e;
}
// 数値取得（空文字・未入力は null）
function num(v) {
  if (v === '' || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
// その日の運行先（未入力ならプロフィールの既定値）
function destOf(entry) {
  const d = (entry?.dest || '').trim();
  if (!d) return profile.defaultDest || '';
  return profile.defaultDest ? `${d}→${profile.defaultDest}` : d;
}
// その日の乗車／降車時刻（未設定なら既定値）
function startTimeOf(entry) { return entry?.startTime || profile.startTime || ''; }
function endTimeOf(entry)   { return entry?.time      || profile.endTime   || ''; }
function getMeter(ds) { return getEntry(ds)?.meter ?? null; }

function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
  monday.setHours(0,0,0,0);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return dateStr(d);
  });
}

function sortedDates() { return Object.keys(state.entries).sort(); }

// 直近の「メーターが入っている日」の値（一時保存＝メーター未入力の日は飛ばす）
function prevMeterBefore(ds) {
  const dates = sortedDates().filter(d => d < ds && getMeter(d) !== null);
  if (!dates.length) return null;
  return getMeter(dates[dates.length - 1]);
}
// メーター未入力（＝一時保存）かどうか
function isPending(entry) { return !!entry && (entry.meter === null || entry.meter === undefined); }
// 費用・タグ・メモのいずれかが入っているか
function hasSideData(entry) {
  if (!entry) return false;
  if (entry.tags?.length || (entry.memo || '').trim()) return true;
  return COST_KEYS.some(c => entry[c.key] !== null && entry[c.key] !== undefined);
}

// ── Persistence ───────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { state = JSON.parse(raw); if (!state.entries) state.entries = {}; }
  } catch { state = { entries: {} }; }
  // 旧形式を一括マイグレーション
  Object.keys(state.entries).forEach(ds => {
    if (typeof state.entries[ds] === 'number')
      state.entries[ds] = { meter: state.entries[ds], tags: [], memo: '' };
  });
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch { showToast('保存に失敗しました'); }
  syncIDB();
}

// ── IndexedDB（SW が通知文面を読むため） ─────────────────────
function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('meter-notif-db', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', {keyPath:'k'});
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
}

async function syncIDB() {
  try {
    const db = await openIDB();
    const weekDates = getWeekDates(0);
    const today = todayStr();
    const lines = weekDates.map(ds => {
      const entry = getEntry(ds); if (!entry) return null;
      const prev = prevMeterBefore(ds);
      const dist = (prev !== null && !isPending(entry)) ? entry.meter - prev : null;
      const tags = entry.tags?.join('・') || '';
      const memo = entry.memo || '';
      const note = [tags, memo].filter(Boolean).join(' ');
      const head = isPending(entry) ? '一時保存（メーター未入力）' : `終${entry.meter.toLocaleString()}km`;
      return `${fmtLabel(ds)} ${head}${dist!==null?' '+dist.toLocaleString()+'km走行':''}${note?' '+note:''}`;
    }).filter(Boolean);

    // メーターが入っていない日（未記録・一時保存）を未入力としてカウント
    const missing = weekDates.filter(ds => ds <= today && getMeter(ds) === null).length;

    const tx = db.transaction('kv','readwrite');
    const st = tx.objectStore('kv');
    st.put({k:'weekly-summary', text: lines.join('\n'), week: weekDates[0]});
    st.put({k:'missing-days', value: missing});
    // 提出済みなら SW 側の日曜通知を抑止する
    st.put({k:'report-sent', week: weekDates[0],
            value: localStorage.getItem(`report-sent-${weekDates[0]}`) === '1'});
  } catch {}
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}

function renderWeekNav() {

  document.getElementById('weekLabel').textContent =
    `${fmt(dates[0])}（月）〜 ${fmt(dates[6])}（日）`;

}

// ── Render: day cards ─────────────────────────────────────────
function renderDayCards() {
  const container = document.getElementById('dayCards');
  container.innerHTML = '';
  const dates = getWeekDates(weekOffset);
  const today = todayStr();

  dates.forEach(ds => {
    const entry = getEntry(ds);
    const prevMeter = prevMeterBefore(ds);
    const pending = isPending(entry);
    const dist = (entry && !pending && prevMeter !== null) ? entry.meter - prevMeter : null;
    const isToday = ds === today;
    const isFuture = ds > today;

    const card = document.createElement('div');
    card.className = `day-card${isToday ? ' today-card open' : ''}`;
    card.dataset.date = ds;

    const labelClass = isToday ? 'is-today' : isFuture ? 'is-future' : '';
    const tagsPreview = entry?.tags?.length ? entry.tags.join('・') : '';

    card.innerHTML = `
      <div class="day-header">
        <span class="day-label ${labelClass}">${fmtLabel(ds)}</span>
        ${entry && !pending
            ? `<span class="day-dist">${entry.meter.toLocaleString()}km</span>`
            : pending
              ? '<span class="day-dist pending-dist">一時保存</span>'
              : '<span class="day-dist" style="color:transparent">―</span>'}
        <span class="day-time">${(entry && !pending) ? (entry.time || '') : ''}</span>
        <span class="day-tags-preview">${tagsPreview}</span>
        ${entry ? (pending ? '<span class="day-check pending-check">…</span>' : '<span class="day-check">✓</span>')
                : '<span style="width:21px;flex-shrink:0"></span>'}
        <span class="day-chevron">▼</span>
      </div>
      <div class="day-body">
        <div class="fld-label">前日終わりメーター</div>
        <div class="meter-prev num">${prevMeter !== null ? prevMeter.toLocaleString() + ' km' : '― （まだ記録なし）'}</div>

        <div class="fld-label">本日終わりメーター</div>
        <div class="meter-input-wrap">
          <input type="number" inputmode="numeric" class="meter-val-input num"
            placeholder="${isFuture ? '―' : '000000'}"
            value="${(entry && !pending) ? entry.meter : ''}"
            ${isFuture ? 'disabled' : ''}>
          <span class="meter-unit">km</span>
        </div>

        <div class="trip-row">
          <span class="t-label">走行距離</span>
          <span class="t-val ${dist === null ? 'zero' : dist < 0 ? 'warn' : ''} num" data-trip>
            ${dist === null ? '― km' : dist < 0 ? '前日より小さい値です' : dist.toLocaleString() + ' km'}
          </span>
        </div>

        <div class="time-pair">
          <div>
            <div class="fld-label">乗車時刻</div>
            <input type="time" class="start-time-input num"
              value="${entry?.startTime || profile.startTime || ''}" ${isFuture ? 'disabled' : ''}>
          </div>
          <div>
            <div class="fld-label">降車時刻</div>
            <input type="time" class="time-input num"
              value="${entry?.time || (profile.autoEndTime ? '' : (profile.endTime || ''))}" ${isFuture ? 'disabled' : ''}>
          </div>
        </div>

        <div class="fld-label">メモタグ（複数選択可）</div>
        <div class="tags-wrap">
          ${TAGS.map(tag =>
            `<button class="tag-pill${entry?.tags?.includes(tag) ? ' active' : ''}" data-tag="${tag}">${tag}</button>`
          ).join('')}
        </div>

        <div class="cost-wrap" data-costs></div>

        <div class="fld-label">フリーメモ</div>
        <textarea class="memo-input" rows="2"
          placeholder="例：〇〇への出張・特記事項">${entry?.memo || ''}</textarea>

        <button class="btn-primary day-save-btn" ${isFuture ? 'disabled' : ''}>${
          (entry && !pending) || !entry ? '保存する' : '一時保存する'
        }</button>
        <div class="save-hint" data-hint>${pending ? '費用のみ記録中。帰社後にメーターを入れると確定します。' : ''}</div>
      </div>
    `;

    // 開閉トグル
    card.querySelector('.day-header').addEventListener('click', () => card.classList.toggle('open'));

    // リアルタイム走行距離
    const meterInput = card.querySelector('.meter-val-input');
    const tripEl = card.querySelector('[data-trip]');
    const saveBtn = card.querySelector('.day-save-btn');
    const hintEl = card.querySelector('[data-hint]');
    function refreshSaveLabel() {
      const empty = meterInput.value.trim() === '';
      saveBtn.textContent = empty ? '一時保存する' : '保存する';
      saveBtn.classList.toggle('btn-pending', empty);
      hintEl.textContent = empty
        ? 'メーター未入力でも、費用やタグだけ先に保存できます。'
        : (pending ? 'メーターを入れて保存すると確定します。' : '');
    }
    refreshSaveLabel();
    meterInput.addEventListener('input', () => {
      refreshSaveLabel();
      const val = parseFloat(meterInput.value);
      if (isNaN(val) || prevMeter === null) {
        tripEl.textContent = '― km'; tripEl.className = 't-val zero num'; return;
      }
      const diff = val - prevMeter;
      if (diff < 0) { tripEl.textContent = '前日より小さい値です'; tripEl.className = 't-val warn num'; }
      else { tripEl.textContent = diff.toLocaleString() + ' km'; tripEl.className = 't-val num'; }
    });

    // タグに応じた金額入力欄を描画（入力中の値は保持）
    const costWrap = card.querySelector('[data-costs]');
    function renderCostFields() {
      const active = [...card.querySelectorAll('.tag-pill.active')].map(p => p.dataset.tag);
      // 現在画面に入っている値を退避
      const typed = {};
      costWrap.querySelectorAll('[data-cost-key]').forEach(i => typed[i.dataset.costKey] = i.value);

      let html = '';
      // 高速タグ：例外の運行先を入力
      if (active.includes('高速')) {
        html += `
          <div class="cost-row dest-row">
            <span class="cost-label">運行先（いつもと違う場合）</span>
            <input type="text" class="cost-input dest-input" data-cost-key="dest"
              placeholder="${profile.defaultDest || '例：A社'}"
              value="${(typed.dest ?? entry?.dest ?? '').replace(/"/g,'&quot;')}">
          </div>`;
      }
      active.forEach(tag => {
        (TAG_FIELDS[tag] || []).forEach(f => {
          const v = typed[f.key] ?? (entry?.[f.key] ?? '');
          html += `
            <div class="cost-row">
              <span class="cost-label">${f.label}</span>
              <input type="number" inputmode="numeric" class="cost-input num"
                data-cost-key="${f.key}" placeholder="0" value="${v}">
              <span class="cost-unit">${f.unit}</span>
            </div>`;
        });
      });
      costWrap.innerHTML = html;
      costWrap.style.display = html ? 'block' : 'none';
    }
    renderCostFields();

    // タグ切り替え（カード開閉と分離）
    card.querySelectorAll('.tag-pill').forEach(pill => {
      pill.addEventListener('click', e => {
        e.stopPropagation();
        pill.classList.toggle('active');
        renderCostFields();
      });
    });

    // 保存
    card.querySelector('.day-save-btn').addEventListener('click', () => {
      const meterVal = num(meterInput.value);
      const tags = [...card.querySelectorAll('.tag-pill.active')].map(p => p.dataset.tag);
      const memo = card.querySelector('.memo-input').value.trim();
      const timeInput = card.querySelector('.time-input').value;
      const nowHHMM = new Date().toTimeString().slice(0,5);
      // 自動記録ONなら保存時刻、OFFなら既定値。手入力があれば常にそれを優先
      const time = timeInput || (profile.autoEndTime ? nowHHMM : (profile.endTime || nowHHMM));
      const startTime = card.querySelector('.start-time-input').value || profile.startTime || '';

      const rec = { meter: meterVal, tags, memo, time, startTime };
      costWrap.querySelectorAll('[data-cost-key]').forEach(i => {
        const k = i.dataset.costKey;
        const v = i.value.trim();
        if (v !== '') rec[k] = (k === 'dest') ? v : num(v);
      });

      // メーター未入力でも、タグ・費用・メモがあれば「一時保存」として残す
      if (meterVal === null && !hasSideData(rec)) {
        showToast('メーター値、または費用・タグを入力してください');
        return;
      }

      state.entries[ds] = rec;
      saveState();
      const btn = card.querySelector('.day-save-btn');
      btn.classList.add('save-pulse');
      setTimeout(() => btn.classList.remove('save-pulse'), 400);
      showToast(meterVal === null
        ? `${fmtLabel(ds)} を一時保存しました（メーターは後で）`
        : `${fmtLabel(ds)} を保存しました`);
      renderAll();
    });

    container.appendChild(card);
  });
}


function renderEtcCard() {
  const dates = getWeekDates(weekOffset);
  const etcCard = document.getElementById('etcCard');
  const etcNote = document.getElementById('etcNote');

  // この週に「高速」タグがある日を抽出
  const highwayDays = dates.filter(ds => getEntry(ds)?.tags?.includes('高速'));

  if (highwayDays.length === 0) {
    etcCard.style.display = 'none';
    return;
  }

  // 週の開始・終了を YYYY/MM/DD 形式で表示（ETC検索欄に貼れる形式）
  const fmt = ds => ds.replace(/-/g, '/');
  const weekStart = fmt(dates[0]);
  const weekEnd   = fmt(dates[6]);
  const dayList   = highwayDays.map(ds => fmtLabel(ds)).join('・');

  etcNote.textContent = `高速利用日：${dayList}　／　検索期間：${weekStart} 〜 ${weekEnd}`;
  etcCard.style.display = 'block';
}

function renderAll() {
  const hasEntries = sortedDates().length > 0;
  document.getElementById('setupCard').style.display = hasEntries ? 'none' : 'block';
  document.getElementById('weekNav').style.display = hasEntries ? 'flex' : 'none';
  document.getElementById('reportCard').style.display = hasEntries ? 'block' : 'none';
  if (!hasEntries) return;
  renderWeekNav();
  renderDayCards();
  renderEtcCard();
  const wkStart = getWeekDates(weekOffset)[0];
  document.getElementById('etcSentCheck').checked =
    localStorage.getItem(etcSentKey(wkStart)) === '1';
  document.getElementById('reportSentCheck').checked = isReportSent(wkStart);
  renderReportNote();
}

// ── Notifications ─────────────────────────────────────────────
async function checkNotifState() {
  if (!('Notification' in window)) return;
  const btn = document.getElementById('notifBtn');
  if (Notification.permission === 'granted') {
    btn.classList.add('granted');
    setupPeriodicSync();
  } else if (Notification.permission === 'default' && !localStorage.getItem(NOTIF_DISMISSED_KEY)) {
    document.getElementById('notifBanner').classList.add('show');
  }
}

async function requestNotifPermission() {
  const perm = await Notification.requestPermission();
  document.getElementById('notifBanner').classList.remove('show');
  if (perm === 'granted') {
    document.getElementById('notifBtn').classList.add('granted');
    showToast('通知を許可しました ✓');
    setupPeriodicSync();
  } else {
    showToast('通知は許可されませんでした');
  }
}

document.getElementById('notifAllowBtn').addEventListener('click', requestNotifPermission);
document.getElementById('notifDismissBtn').addEventListener('click', () => {
  localStorage.setItem(NOTIF_DISMISSED_KEY, '1');
  document.getElementById('notifBanner').classList.remove('show');
});
document.getElementById('notifBtn').addEventListener('click', () => {
  if (Notification.permission === 'granted') showToast('通知は許可済みです ✓');
  else requestNotifPermission();
});

async function setupPeriodicSync() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    if ('periodicSync' in reg) {
      const status = await navigator.permissions.query({name:'periodic-background-sync'});
      if (status.state === 'granted') {
        await reg.periodicSync.register('weekly-check', {minInterval: 6 * 60 * 60 * 1000});
      }
    }
  } catch {}
}

// アプリを開いたタイミングでのフォールバック通知チェック
function checkOnOpen() {
  const now = new Date();
  const day = now.getDay();   // 0=日, 1=月
  const hour = now.getHours();
  const banner = document.getElementById('reminderBanner');
  banner.classList.remove('show');

  // 日曜 20時以降：未記録チェック
  if (day === 0 && hour >= 20) {
    const weekDates = getWeekDates(0);
    if (isReportSent(weekDates[0])) return;   // 提出済みの週は催促しない
    const missing = weekDates.filter(ds => ds <= todayStr() && getMeter(ds) === null);
    if (missing.length > 0) {
      banner.innerHTML = `<strong>📋 今週の日報を忘れずに！</strong><br>未記録の日が <strong style="color:var(--amber)">${missing.length}日</strong> あります。`;
      banner.classList.add('show');
    }
  }

  // 月曜 0〜10時：先週サマリー表示
  if (day === 1 && hour < 10) {
    const lastWeekDates = getWeekDates(-1);
    const shownKey = `monday-shown-${lastWeekDates[0]}`;
    if (!localStorage.getItem(shownKey)) {
      const recorded = lastWeekDates.filter(ds => getEntry(ds));
      if (recorded.length > 0) {
        const totalDist = lastWeekDates.reduce((sum, ds) => {
          const e = getEntry(ds); const prev = prevMeterBefore(ds);
          return (e && prev !== null) ? sum + (e.meter - prev) : sum;
        }, 0);
        const fmt = ds => { const d = new Date(ds+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; };
        banner.innerHTML = `<strong>🚗 先週の走行まとめ</strong>（${fmt(lastWeekDates[0])}〜${fmt(lastWeekDates[6])}）<br>記録日数: ${recorded.length}日 ／ 合計走行: <strong style="color:var(--mint)">${totalDist.toLocaleString()}km</strong>`;
        banner.classList.add('show');
        localStorage.setItem(shownKey, '1');
      }
    }
  }
}

function reportSentKey(weekStart) { return `report-sent-${weekStart}`; }
function isReportSent(weekStart) { return localStorage.getItem(reportSentKey(weekStart)) === '1'; }
function setReportSent(weekStart, sent) {

}
document.getElementById('reportSentCheck').addEventListener('change', e => {
  const wk = getWeekDates(weekOffset)[0];
  setReportSent(wk, e.target.checked);
  renderReportNote();
  showToast(e.target.checked
    ? 'この週を提出済みにしました（日曜の通知は止まります）'
    : '提出済みを解除しました');
});
function renderReportNote() {
  const wk = getWeekDates(weekOffset)[0];
  const el = document.getElementById('reportNote');
  el.textContent = isReportSent(wk) ? '✅ 提出済み。日曜のリマインド通知は届きません。' : '';
}

// ── ETC送付済みチェック ───────────────────────────────────────
function etcSentKey(weekStart) { return `etc-sent-${weekStart}`; }
document.getElementById('etcSentCheck').addEventListener('change', e => {
  const dates = getWeekDates(weekOffset);
  localStorage.setItem(etcSentKey(dates[0]), e.target.checked ? '1' : '');
  showToast(e.target.checked ? 'ETC明細を送付済みにしました' : '送付済みを解除しました');
});

// ── 週次レポート生成 ──────────────────────────────────────────
// UTF-8 対応 Base64（URLに載せるためハッシュ記号などを避ける）
function encodePayload(obj) {
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function buildReportPayload() {
  const dates = getWeekDates(weekOffset);
  const days = dates.map(ds => {
    const e = getEntry(ds);
    if (!e) return { d: ds };
    const prev = prevMeterBefore(ds);
    return {
      d: ds,
      s: prev,                    // 乗車時指針（前日の降車時指針）
      e: e.meter,                 // 降車時指針
      dest: destOf(e),
      st: startTimeOf(e),
      et: endTimeOf(e),
      tags: e.tags || [],
      fuelL: e.fuelL ?? null, fuelYen: e.fuelYen ?? null,
      tollYen: e.tollYen ?? null, parkYen: e.parkYen ?? null,
      washYen: e.washYen ?? null, otherYen: e.otherYen ?? null,
      memo: e.memo || ''
    };
  });
  return {
    v: 1,
    name: profile.name, dept: profile.dept, vehicleNo: profile.vehicleNo,
    email: profile.email || '',
    from: dates[0], to: dates[6],
    prevMeter: prevMeterBefore(dates[0]),   // 前週最終指針値
    etcSent: localStorage.getItem(etcSentKey(dates[0])) === '1',
    days
  };
}

function reportUrl() {
  const base = location.href.replace(/[^/]*$/, '') + 'report.html';
  return base + '#w=' + encodePayload(buildReportPayload());
}

document.getElementById('reportBtn').addEventListener('click', () => {
  if (!isProfileReady()) { showToast('先に⚙から基本情報を設定してください'); return; }
  location.href = reportUrl();
});

// ── Init ──────────────────────────────────────────────────────
(function init() {
  loadProfile();
  applyTitle();
  loadState();
  const ready = isProfileReady();
  showProfileCard(!ready);
  if (ready) {
    bootDone = true;
    renderAll();
    checkNotifState();
    checkOnOpen();
    syncIDB();
  } else {
    document.getElementById('setupCard').style.display = 'none';
    document.getElementById('weekNav').style.display = 'none';
    document.getElementById('reportCard').style.display = 'none';
  }
})();
</script>
